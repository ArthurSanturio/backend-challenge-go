# Ambiente isolado: sem volumes persistentes e com portas livres escolhidas pelo Docker.
services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: http_integration
      POSTGRES_USER: challenge
      POSTGRES_PASSWORD: integration_local_only
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: [start-dev, --import-realm]
    environment:
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1::8080"
    volumes:
      - ./deploy/keycloak/wallet-realm.json:/opt/keycloak/data/import/wallet-realm.json:ro
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000;
          printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3;
          read -r status <&3;
          [[ "$$status" == *" 200 "* ]]
      interval: 3s
      timeout: 3s
      retries: 50
      start_period: 20s

  ministack:
    image: ministackorg/ministack:1.5.30
    environment:
      AUTH: "true"
    ports:
      - "127.0.0.1::4566"
